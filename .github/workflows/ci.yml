name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo (gitleaks scans history, no writes).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Committed secrets fail the build, across the whole history.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Critical advisories block; the remaining highs are reported without
      # blocking.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run test:smoke
      # Public Sepolia configuration lets browser checks exercise Base routes.
      # No signer, Circle credentials or internal secrets are used by CI.
      - run: npm run build
        env:
          NEXT_PUBLIC_MARKET_CHAINS: base
          NEXT_PUBLIC_BASE_NETWORK: testnet
          NEXT_PUBLIC_CONVEX_URL: https://hushed-orca-915.convex.cloud
          NEXT_PUBLIC_MIMIR_BASE_V3_ADDRESS: '0xB29BCcA174B78bE6448234c94Bf1caab44824948'
          NEXT_PUBLIC_MIMIR_BASE_POOL_ADDRESS: '0x9d3721dc087103228a4bA9EC72dacEb1B19b4402'
          NEXT_PUBLIC_MIMIR_BASE_FEES_ADDRESS: '0xd3356F1a085068b2DA2dfE1A09f1e8ddf0eC0858'
      # Browser smoke: every page on desktop + mobile, no console errors, no
      # horizontal overflow. Runs against the build above.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
