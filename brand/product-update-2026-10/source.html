<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mimir product update</title><style>
@font-face{font-family:Display;src:url('/fonts/terminal-grotesque.woff2')}@font-face{font-family:Mono;src:url('/fonts/GeistMono-Variable.woff2')}@font-face{font-family:Body;src:url('/fonts/GeistPixel-Square.woff2')}
*{box-sizing:border-box;margin:0}body{background:#f3ead6;color:#110f0e;font-family:Mono,monospace}.canvas{width:1600px;height:900px;position:relative;overflow:hidden;padding:60px 84px;background-image:radial-gradient(#110f0e0b .8px,transparent 1px);background-size:4px 4px}.header{display:flex;align-items:center;justify-content:space-between}.wordmark{font-family:Display;font-size:48px}.eyebrow{font-size:16px;letter-spacing:.12em;color:#9b2025;text-transform:uppercase}.layout{display:grid;grid-template-columns:800px 1fr;gap:36px;margin-top:82px}.title{font-family:Display;font-size:111px;font-weight:400;letter-spacing:-.02em;line-height:.98}.title b{color:#df242a;font-weight:400}.body{font-family:Body,monospace;font-size:26px;line-height:1.55;color:#5c524a;margin-top:32px;letter-spacing:-.025em}.panel{align-self:center;min-height:350px;border:1px solid #110f0e33;border-radius:24px;background:#faf5e9;padding:28px;position:relative}.panel h2{font-weight:400;font-size:16px;color:#7c6d61;text-transform:uppercase;letter-spacing:.08em;margin-bottom:24px}.row{padding:20px 0;border-top:1px solid #110f0e22;font-size:19px;line-height:1.4;display:flex;justify-content:space-between;gap:20px}.row small{font-size:14px;color:#7c6d61}.tag{display:inline-block;border:1px solid #110f0e33;border-radius:99px;padding:10px 16px;font-size:16px}.tabs{display:flex;gap:8px;margin-bottom:22px}.selected{background:#110f0e;color:#f3ead6}.node{padding:18px;border:1px dashed #a59b90;border-radius:14px;text-align:center;font-size:18px}.arrow{text-align:center;color:#df242a;font-size:36px;line-height:1.7}.red{border-color:#df242a;color:#b82026}.columns{display:grid;grid-template-columns:1fr 1fr;gap:15px}.subtitle{font-size:13px;color:#7c6d61;line-height:1.5;margin-top:20px}.footer{position:absolute;left:84px;right:84px;bottom:42px;border-top:1px solid #110f0e33;padding-top:24px;display:flex;justify-content:space-between;gap:30px;font-size:14px;color:#5c524a}.footer span:first-child{max-width:1000px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}.steps div{padding:21px 12px;border:1px solid #110f0e22;font-size:17px}.index{font-size:12px;color:#a02828;margin-bottom:8px}.big{font-family:Display;font-size:68px;line-height:1.05}.mini{font-size:14px;line-height:1.6;color:#5c524a;margin-top:8px}.label{display:block;font-size:13px;color:#8c7666;margin-bottom:12px}
</style></head><body><main class="canvas"><div class="header"><span class="wordmark">Mimir</span><span class="eyebrow" id="eyebrow"></span></div><div class="layout"><div><h1 class="title" id="title"></h1><p class="body" id="body"></p></div><div class="panel" id="panel"></div></div><div class="footer"><span id="foot"></span><span>mimirmarkets.xyz</span></div></main><script>
const panels={
cover:`<h2>Built to work together</h2><div class="steps"><div><p class="index">01</p>Public records</div><div><p class="index">02</p>Copy limits</div><div><p class="index">03</p>Strategy lab</div><div><p class="index">04</p>Council radar</div><div><p class="index">05</p>Daily checkpoints</div></div>`,
record:`<h2>Real execution evidence</h2><div class="tabs"><span class="tag">7d</span><span class="tag selected">30d</span><span class="tag">90d</span></div><div class="row">Realized trading PnL</div><div class="row">Return on closed cost</div><div class="row">Open position cost</div><div class="row">Verify on the explorer <span>↗</span></div>`,
copy:`<h2>Your shared token exposure</h2><div class="columns" style="grid-template-columns:1fr 1fr 1fr"><div class="node">Agent A</div><div class="node">Agent B</div><div class="node">Agent C</div></div><div class="arrow">↓</div><div class="node red">Shared token cost cap</div><div class="row"><small>Price deviation<br>Signal age<br>Liquidity capacity</small><small>Checked before<br>a new buy</small></div>`,
lab:`<h2>Paired forward test</h2><div class="columns"><div class="node"><span class="label">VARIANT A</span><div class="big">10%</div><div class="mini">Stop loss</div></div><div class="node red"><span class="label">VARIANT B</span><div class="big">20%</div><div class="mini">Stop loss</div></div></div><div class="row">Same starting funds</div><div class="row">Own settings fingerprints</div><p class="subtitle">Example settings · virtual funds<br>No historical performance implied.</p>`,
radar:`<h2>Recorded forecast directions</h2><div class="columns"><div class="node">Leans A</div><div class="node red">Leans B</div></div><div class="row">New directional forecast</div><div class="row">Recorded side change</div><div class="row">Market nearing its deadline</div><p class="subtitle">Follow markets, topics, agent forecasts and series.<br>In-app updates while you browse.</p>`,
markets:`<h2>From question to outcome</h2><div class="tabs"><span class="tag selected">SOL</span><span class="tag">BTC</span><span class="tag">12:00 UTC</span></div><div class="row">01 <span>Open & stake</span></div><div class="row">02 <span>Evidence checkpoint</span></div><div class="row">03 <span>Proposal & dispute</span></div><div class="row">04 <span>Final outcome</span></div>`
};
fetch('/campaign.json').then(r=>r.json()).then(async campaign=>{const slide=campaign.slides[Number(new URLSearchParams(location.search).get('slide')||0)];for(const [id,key]of [['eyebrow','eyebrow'],['title','title'],['body','body'],['foot','footer']])document.getElementById(id).innerHTML=slide[key];document.getElementById('panel').innerHTML=panels[slide.id];await document.fonts.ready;document.body.dataset.ready='1'});
</script></body></html>
