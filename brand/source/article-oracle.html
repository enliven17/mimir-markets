<!doctype html>
<html><head><meta charset="utf-8"><title>Mimir oracle</title><link rel="stylesheet" href="base.css"><style>
  .canvas { width: 1600px; height: 900px; }
  .glow { position:absolute; inset:0; background: radial-gradient(ellipse 760px 420px at 1100px 620px, rgb(255 43 43 / 0.16), rgb(17 15 14 / 0) 70%); }
  .head { position:absolute; left:90px; top:70px; right:90px; }
  .eyebrow { display:flex; align-items:center; gap:14px; font-size:18px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }
  .eyebrow .sq { width:10px; height:10px; background:var(--red); box-shadow:0 0 14px rgb(255 43 43 / 0.8); }
  h1 { margin-top:22px; font-size:72px; }
  .sub { margin-top:16px; font-size:24px; color:var(--muted); }
  .fig { position:absolute; left:90px; right:90px; top:300px; bottom:110px; display:flex; align-items:center; }
  .fig svg { width:100%; height:100%; }
  .foot { position:absolute; left:90px; right:90px; bottom:46px; display:flex; justify-content:space-between; font-size:18px; letter-spacing:0.14em; color:var(--muted); }
  .foot b { color:var(--cream); font-weight:400; }
  svg text { font-family: "Mono", monospace; }
  .box { fill:#0a0808; stroke:#3a302d; stroke-width:1.5; }
  .box-hot { fill:rgb(255 43 43 / 0.12); stroke:#ff2b2b; stroke-width:1.5; }
  .t-title { fill:#f3ead6; font-size:14px; font-weight:500; }
  .t-sub { fill:#a89d93; font-size:10.5px; }
  .t-tag { fill:#ff5148; font-size:10.5px; letter-spacing:0.1em; }
  .t-ok { fill:#6ee7a0; font-size:10.5px; }
  .flow { stroke:#ff2b2b; stroke-width:2; fill:none; stroke-dasharray:7 6; }
  .flow-quiet { stroke:#a89d93; stroke-width:1.5; fill:none; stroke-dasharray:4 5; }
  .arrow { fill:#ff2b2b; } .arrow-quiet { fill:#a89d93; }
</style></head>
<body><div class="canvas"><div class="dots"></div><div class="glow"></div>
<div class="head"><div class="eyebrow mono"><span class="sq"></span>How Mimir works · 3/4</div><h1 class="display">How the oracle decides</h1><p class="sub pixel">Rules first, evidence next, a refund when unsure.</p></div>
<div class="fig"><svg viewBox="0 0 920 300" preserveAspectRatio="xMidYMid meet" aria-labelledby="or-t or-d">
        
        <defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
        <rect x="10" y="20" width="260" height="120" rx="12" class="box"/>
        <text x="28" y="46" class="t-tag">1 · DETERMINISTIC FIRST</text>
        <text x="28" y="72" class="t-sub">price rule on the market</text>
        <text x="28" y="92" class="t-sub">Polymarket, once UMA has resolved</text>
        <text x="28" y="112" class="t-sub">allow-listed JSON source</text>
        <rect x="330" y="20" width="260" height="120" rx="12" class="box"/>
        <text x="348" y="46" class="t-tag">2 · EVIDENCE + PRICES</text>
        <text x="348" y="72" class="t-sub">fetch the named source</text>
        <text x="348" y="92" class="t-sub">deadline price from two feeds</text>
        <text x="348" y="112" class="t-sub">(CoinGecko, CoinMarketCap, ...)</text>
        <rect x="650" y="20" width="260" height="120" rx="12" class="box"/>
        <text x="668" y="46" class="t-tag">3 · MODEL VERDICT</text>
        <text x="668" y="72" class="t-sub">settlement-grade model only</text>
        <text x="668" y="92" class="t-sub">side + confidence + reasons</text>
        <text x="668" y="112" class="t-sub">prices override a wrong read</text>
        <path d="M270 80 L328 80" class="flow" marker-end="url(#ah3)"/>
        <text x="276" y="70" class="t-sub">no rule</text>
        <path d="M590 80 L648 80" class="flow" marker-end="url(#ah3)"/>
        <rect x="10" y="180" width="280" height="100" rx="12" class="box-hot"/>
        <text x="28" y="206" class="t-tag">≥ 80% · SETTLE</text>
        <text x="28" y="230" class="t-sub">the proposed side stands unless</text>
        <text x="28" y="250" class="t-sub">disputed in the window</text>
        <rect x="320" y="180" width="280" height="100" rx="12" class="box"/>
        <text x="338" y="206" class="t-tag">60–79% · CONTESTED</text>
        <text x="338" y="230" class="t-sub">settles, marked contested</text>
        <text x="338" y="250" class="t-sub">house positions need ≥ 80%</text>
        <rect x="630" y="180" width="280" height="100" rx="12" class="box"/>
        <text x="648" y="206" class="t-tag">&lt; 60% OR NO EVIDENCE · REFUND</text>
        <text x="648" y="230" class="t-sub">a refund instead of a guess</text>
        <text x="648" y="250" class="t-sub">no fee taken on a refund payout</text>
        <path d="M780 140 L780 160 L150 160 L150 178" class="flow-quiet"/>
        <path d="M460 160 L460 178" class="flow-quiet"/>
        <path d="M780 160 L780 178" class="flow-quiet"/>
      </svg></div>
<div class="foot mono"><span>Don't argue. <b>Settle.</b></span><span>mimirmarkets.xyz</span></div>
</div><script>document.fonts.ready.then(()=>{document.body.dataset.ready='1'})</script></body></html>
