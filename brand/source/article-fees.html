<!doctype html>
<html><head><meta charset="utf-8"><title>Mimir fees</title><link rel="stylesheet" href="base.css"><style>
  .canvas { width: 1600px; height: 900px; }
  .glow { position:absolute; inset:0; background: radial-gradient(ellipse 760px 420px at 1100px 620px, rgb(255 43 43 / 0.16), rgb(17 15 14 / 0) 70%); }
  .head { position:absolute; left:90px; top:70px; right:90px; }
  .eyebrow { display:flex; align-items:center; gap:14px; font-size:18px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }
  .eyebrow .sq { width:10px; height:10px; background:var(--red); box-shadow:0 0 14px rgb(255 43 43 / 0.8); }
  h1 { margin-top:22px; font-size:72px; }
  .sub { margin-top:16px; font-size:24px; color:var(--muted); }
  .fig { position:absolute; left:90px; right:90px; top:300px; bottom:110px; display:flex; align-items:center; }
  .fig svg { width:100%; height:100%; }
  .foot { position:absolute; left:90px; right:90px; bottom:46px; display:flex; justify-content:space-between; font-size:18px; letter-spacing:0.14em; color:var(--muted); }
  .foot b { color:var(--cream); font-weight:400; }
  svg text { font-family: "Mono", monospace; }
  .box { fill:#0a0808; stroke:#3a302d; stroke-width:1.5; }
  .box-hot { fill:rgb(255 43 43 / 0.12); stroke:#ff2b2b; stroke-width:1.5; }
  .t-title { fill:#f3ead6; font-size:14px; font-weight:500; }
  .t-sub { fill:#a89d93; font-size:10.5px; }
  .t-tag { fill:#ff5148; font-size:10.5px; letter-spacing:0.1em; }
  .t-ok { fill:#6ee7a0; font-size:10.5px; }
  .flow { stroke:#ff2b2b; stroke-width:2; fill:none; stroke-dasharray:7 6; }
  .flow-quiet { stroke:#a89d93; stroke-width:1.5; fill:none; stroke-dasharray:4 5; }
  .arrow { fill:#ff2b2b; } .arrow-quiet { fill:#a89d93; }
</style></head>
<body><div class="canvas"><div class="dots"></div><div class="glow"></div>
<div class="head"><div class="eyebrow mono"><span class="sq"></span>How Mimir works · 4/4</div><h1 class="display">Fees and $MIMIR</h1><p class="sub pixel">One entry fee. No fee on winnings.</p></div>
<div class="fig"><svg viewBox="0 0 920 210" preserveAspectRatio="xMidYMid meet" aria-labelledby="fee-t fee-d">
        
        <defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
        <rect x="10" y="30" width="190" height="110" rx="12" class="box"/>
        <text x="28" y="58" class="t-tag">YOU STAKE</text>
        <text x="28" y="92" class="t-title">100 USDC</text>
        <path d="M200 85 L268 85" class="flow" marker-end="url(#ah4)"/>
        <rect x="270" y="30" width="330" height="110" rx="12" class="box-hot"/>
        <text x="288" y="58" class="t-tag">ENTRY FEE, ONCE</text>
        <text x="288" y="84" class="t-sub">standard</text><text x="420" y="84" class="t-sub">0.5%</text><text x="490" y="84" class="t-sub">0.50 USDC</text>
        <text x="288" y="104" class="t-sub">5M+ $MIMIR</text><text x="420" y="104" class="t-sub">0.25%</text><text x="490" y="104" class="t-sub">0.25 USDC</text>
        <text x="288" y="124" class="t-sub">10M+ $MIMIR</text><text x="420" y="124" class="t-sub">0.1%</text><text x="490" y="124" class="t-sub">0.10 USDC</text>
        <path d="M600 85 L668 85" class="flow" marker-end="url(#ah4)"/>
        <rect x="670" y="30" width="240" height="110" rx="12" class="box"/>
        <text x="688" y="58" class="t-tag">IN THE MARKET</text>
        <text x="688" y="92" class="t-title">99.50 USDC</text>
        <text x="688" y="116" class="t-ok">no fee on winnings</text>
        <text x="10" y="186" class="t-sub">Copy trades only: 1% of the profit to the creator, 1% to Mimir, at payout. Refunds return the stake; the entry fee stays earned.</text>
      </svg></div>
<div class="foot mono"><span>Don't argue. <b>Settle.</b></span><span>mimirmarkets.xyz</span></div>
</div><script>document.fonts.ready.then(()=>{document.body.dataset.ready='1'})</script></body></html>
