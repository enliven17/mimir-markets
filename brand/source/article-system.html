<!doctype html>
<html><head><meta charset="utf-8"><title>Mimir system</title><link rel="stylesheet" href="base.css"><style>
  .canvas { width: 1600px; height: 900px; }
  .glow { position:absolute; inset:0; background: radial-gradient(ellipse 760px 420px at 1100px 620px, rgb(255 43 43 / 0.16), rgb(17 15 14 / 0) 70%); }
  .head { position:absolute; left:90px; top:70px; right:90px; }
  .eyebrow { display:flex; align-items:center; gap:14px; font-size:18px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }
  .eyebrow .sq { width:10px; height:10px; background:var(--red); box-shadow:0 0 14px rgb(255 43 43 / 0.8); }
  h1 { margin-top:22px; font-size:72px; }
  .sub { margin-top:16px; font-size:24px; color:var(--muted); }
  .fig { position:absolute; left:90px; right:90px; top:300px; bottom:110px; display:flex; align-items:center; }
  .fig svg { width:100%; height:100%; }
  .foot { position:absolute; left:90px; right:90px; bottom:46px; display:flex; justify-content:space-between; font-size:18px; letter-spacing:0.14em; color:var(--muted); }
  .foot b { color:var(--cream); font-weight:400; }
  svg text { font-family: "Mono", monospace; }
  .box { fill:#0a0808; stroke:#3a302d; stroke-width:1.5; }
  .box-hot { fill:rgb(255 43 43 / 0.12); stroke:#ff2b2b; stroke-width:1.5; }
  .t-title { fill:#f3ead6; font-size:14px; font-weight:500; }
  .t-sub { fill:#a89d93; font-size:10.5px; }
  .t-tag { fill:#ff5148; font-size:10.5px; letter-spacing:0.1em; }
  .t-ok { fill:#6ee7a0; font-size:10.5px; }
  .flow { stroke:#ff2b2b; stroke-width:2; fill:none; stroke-dasharray:7 6; }
  .flow-quiet { stroke:#a89d93; stroke-width:1.5; fill:none; stroke-dasharray:4 5; }
  .arrow { fill:#ff2b2b; } .arrow-quiet { fill:#a89d93; }
</style></head>
<body><div class="canvas"><div class="dots"></div><div class="glow"></div>
<div class="head"><div class="eyebrow mono"><span class="sq"></span>How Mimir works · 1/4</div><h1 class="display">How Mimir works</h1><p class="sub pixel">Your wallet stays on Solana. Markets settle on Arc.</p></div>
<div class="fig"><svg viewBox="0 0 920 430" preserveAspectRatio="xMidYMid meet" aria-labelledby="sys-t sys-d">
        
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
          <marker id="ahq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow-quiet"/></marker>
        </defs>
        <!-- row 1 -->
        <rect x="10" y="20" width="230" height="120" rx="12" class="box"/>
        <text x="28" y="46" class="t-tag">SOLANA</text>
        <text x="28" y="72" class="t-title">Your wallet</text>
        <text x="28" y="96" class="t-sub">Phantom, Solflare, any wallet</text>
        <text x="28" y="116" class="t-sub">USDC and $MIMIR live here</text>

        <rect x="345" y="20" width="230" height="120" rx="12" class="box-hot"/>
        <text x="363" y="46" class="t-tag">ARC</text>
        <text x="363" y="72" class="t-title">Passkey account</text>
        <text x="363" y="96" class="t-sub">Face ID or fingerprint</text>
        <text x="363" y="116" class="t-sub">gas sponsored, no seed phrase</text>

        <rect x="680" y="20" width="230" height="120" rx="12" class="box"/>
        <text x="698" y="46" class="t-tag">ARC · CONTRACTS</text>
        <text x="698" y="72" class="t-title">MimirV3 · MimirPool</text>
        <text x="698" y="96" class="t-sub">duels and two-sided pools</text>
        <text x="698" y="116" class="t-sub">USDC escrow, fees, payouts</text>

        <path d="M240 70 L343 70" class="flow" marker-end="url(#ah)"/>
        <text x="252" y="60" class="t-sub">CCTP in ~15 s</text>
        <path d="M343 100 L242 100" class="flow-quiet" marker-end="url(#ahq)"/>
        <text x="252" y="122" class="t-sub">out ~30 s</text>
        <path d="M575 80 L678 80" class="flow" marker-end="url(#ah)"/>
        <text x="600" y="70" class="t-sub">stake</text>
        <path d="M678 110 L577 110" class="flow-quiet" marker-end="url(#ahq)"/>
        <text x="596" y="128" class="t-sub">payout</text>

        <!-- convex -->
        <rect x="345" y="210" width="565" height="200" rx="14" class="box"/>
        <text x="363" y="236" class="t-tag">BACKEND</text>
        <rect x="363" y="252" width="128" height="140" rx="10" class="box"/>
        <text x="375" y="276" class="t-title">Indexer</text>
        <text x="375" y="298" class="t-sub">every 30 s</text>
        <text x="375" y="322" class="t-sub">markets,</text>
        <text x="375" y="340" class="t-sub">positions,</text>
        <text x="375" y="358" class="t-sub">every tx</text>
        <rect x="499" y="252" width="128" height="140" rx="10" class="box"/>
        <text x="511" y="276" class="t-title">Oracle</text>
        <text x="511" y="298" class="t-sub">every minute</text>
        <text x="511" y="322" class="t-sub">proposes,</text>
        <text x="511" y="340" class="t-sub">finalizes,</text>
        <text x="511" y="358" class="t-sub">pays, refunds</text>
        <rect x="635" y="252" width="128" height="140" rx="10" class="box"/>
        <text x="647" y="276" class="t-title">Council</text>
        <text x="647" y="298" class="t-sub">every 5 min</text>
        <text x="647" y="322" class="t-sub">20 AI personas,</text>
        <text x="647" y="340" class="t-sub">takes and</text>
        <text x="647" y="358" class="t-sub">stakes</text>
        <rect x="771" y="252" width="122" height="140" rx="10" class="box"/>
        <text x="783" y="276" class="t-title">Creator</text>
        <text x="783" y="298" class="t-sub">hourly</text>
        <text x="783" y="322" class="t-sub">house markets</text>
        <text x="783" y="340" class="t-sub">from live data,</text>
        <text x="783" y="358" class="t-sub">daily budget</text>
        <path d="M795 140 L795 208" class="flow" marker-end="url(#ah)"/>
        <text x="805" y="184" class="t-sub">events</text>
        <path d="M720 208 L720 142" class="flow" marker-end="url(#ah)"/>
        <text x="610" y="184" class="t-sub">verdicts, stakes</text>

        <!-- web -->
        <rect x="10" y="250" width="230" height="120" rx="12" class="box"/>
        <text x="28" y="276" class="t-tag">WEB · TELEGRAM</text>
        <text x="28" y="302" class="t-title">mimirmarkets.xyz</text>
        <text x="28" y="326" class="t-sub">live index, no polling</text>
        <text x="28" y="346" class="t-sub">alerts in Telegram</text>
        <path d="M343 310 L242 310" class="flow" marker-end="url(#ah)"/>
        <text x="258" y="300" class="t-sub">live queries</text>
      </svg></div>
<div class="foot mono"><span>Don't argue. <b>Settle.</b></span><span>mimirmarkets.xyz</span></div>
</div><script>document.fonts.ready.then(()=>{document.body.dataset.ready='1'})</script></body></html>
