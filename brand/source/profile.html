<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mimir profile</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    /* 400×400, circle-safe: X crops avatars to a circle, so everything that
       matters sits inside the middle 70%. */
    .canvas { width: 400px; height: 400px; display: grid; place-items: center; }
    .glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 52%, rgb(255 43 43 / 0.34), rgb(143 14 23 / 0.16) 38%, rgb(17 15 14 / 0) 62%);
    }
    .mark { position: relative; width: 218px; transform: translate(-4px, 4px); filter: drop-shadow(0 0 22px rgb(255 43 43 / 0.35)); }
    .mark img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="canvas">
    <canvas class="field" id="field"></canvas>
    <div class="dots"></div>
    <div class="glow"></div>
    <div class="mark"><img src="horn.svg" alt="" /></div>
  </div>
  <script type="module">
    import { drawField } from './parts.js'
    await document.fonts.ready
    await document.querySelector('.mark img').decode()
    // Rings around the mark, fading out towards the circle crop.
    drawField(document.getElementById('field'), {
      cell: 12, frame: 52, cx: 0.5, cy: 0.5, spread: 16,
      mask: (x, y) => {
        const d = Math.hypot(x - 0.5, y - 0.5)
        return d < 0.2 ? d / 0.2 * 0.5 : Math.max(0, 1 - (d - 0.2) / 0.32)
      },
    })
    document.body.dataset.ready = '1'
  </script>
</body>
</html>
