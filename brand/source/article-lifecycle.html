<!doctype html>
<html><head><meta charset="utf-8"><title>Mimir lifecycle</title><link rel="stylesheet" href="base.css"><style>
  .canvas { width: 1600px; height: 900px; }
  .glow { position:absolute; inset:0; background: radial-gradient(ellipse 760px 420px at 1100px 620px, rgb(255 43 43 / 0.16), rgb(17 15 14 / 0) 70%); }
  .head { position:absolute; left:90px; top:70px; right:90px; }
  .eyebrow { display:flex; align-items:center; gap:14px; font-size:18px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); }
  .eyebrow .sq { width:10px; height:10px; background:var(--red); box-shadow:0 0 14px rgb(255 43 43 / 0.8); }
  h1 { margin-top:22px; font-size:72px; }
  .sub { margin-top:16px; font-size:24px; color:var(--muted); }
  .fig { position:absolute; left:90px; right:90px; top:300px; bottom:110px; display:flex; align-items:center; }
  .fig svg { width:100%; height:100%; }
  .foot { position:absolute; left:90px; right:90px; bottom:46px; display:flex; justify-content:space-between; font-size:18px; letter-spacing:0.14em; color:var(--muted); }
  .foot b { color:var(--cream); font-weight:400; }
  svg text { font-family: "Mono", monospace; }
  .box { fill:#0a0808; stroke:#3a302d; stroke-width:1.5; }
  .box-hot { fill:rgb(255 43 43 / 0.12); stroke:#ff2b2b; stroke-width:1.5; }
  .t-title { fill:#f3ead6; font-size:14px; font-weight:500; }
  .t-sub { fill:#a89d93; font-size:10.5px; }
  .t-tag { fill:#ff5148; font-size:10.5px; letter-spacing:0.1em; }
  .t-ok { fill:#6ee7a0; font-size:10.5px; }
  .flow { stroke:#ff2b2b; stroke-width:2; fill:none; stroke-dasharray:7 6; }
  .flow-quiet { stroke:#a89d93; stroke-width:1.5; fill:none; stroke-dasharray:4 5; }
  .arrow { fill:#ff2b2b; } .arrow-quiet { fill:#a89d93; }
</style></head>
<body><div class="canvas"><div class="dots"></div><div class="glow"></div>
<div class="head"><div class="eyebrow mono"><span class="sq"></span>How Mimir works · 2/4</div><h1 class="display">A market, start to finish</h1><p class="sub pixel">From the first stake to the payout.</p></div>
<div class="fig"><svg viewBox="0 0 920 230" preserveAspectRatio="xMidYMid meet" aria-labelledby="life-t life-d">
        
        <defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
        <g>
          <rect x="10" y="20" width="132" height="110" rx="12" class="box-hot"/>
          <text x="24" y="46" class="t-tag">1 · OPEN</text>
          <text x="24" y="72" class="t-sub">stakes come in,</text>
          <text x="24" y="90" class="t-sub">0.5% entry fee</text>
          <text x="24" y="108" class="t-sub">each</text>
          <rect x="164" y="20" width="132" height="110" rx="12" class="box"/>
          <text x="178" y="46" class="t-tag">2 · LOCK</text>
          <text x="178" y="72" class="t-sub">betting closes</text>
          <text x="178" y="90" class="t-sub">60 s before the</text>
          <text x="178" y="108" class="t-sub">deadline</text>
          <rect x="318" y="20" width="132" height="110" rx="12" class="box"/>
          <text x="332" y="46" class="t-tag">3 · PROPOSE</text>
          <text x="332" y="72" class="t-sub">oracle reads the</text>
          <text x="332" y="90" class="t-sub">source, posts a</text>
          <text x="332" y="108" class="t-sub">result + hash</text>
          <rect x="472" y="20" width="132" height="110" rx="12" class="box"/>
          <text x="486" y="46" class="t-tag">4 · DISPUTE</text>
          <text x="486" y="72" class="t-sub">participants may</text>
          <text x="486" y="90" class="t-sub">dispute with a</text>
          <text x="486" y="108" class="t-sub">2 USDC bond</text>
          <rect x="626" y="20" width="132" height="110" rx="12" class="box"/>
          <text x="640" y="46" class="t-tag">5 · FINAL</text>
          <text x="640" y="72" class="t-sub">window closes,</text>
          <text x="640" y="90" class="t-sub">anyone may</text>
          <text x="640" y="108" class="t-sub">finalize</text>
          <rect x="780" y="20" width="130" height="110" rx="12" class="box"/>
          <text x="794" y="46" class="t-tag">6 · PAID</text>
          <text x="794" y="72" class="t-ok">winners paid to</text>
          <text x="794" y="90" class="t-ok">their account,</text>
          <text x="794" y="108" class="t-ok">no claim step</text>
        </g>
        <path d="M142 75 L162 75" class="flow" marker-end="url(#ah2)"/>
        <path d="M296 75 L316 75" class="flow" marker-end="url(#ah2)"/>
        <path d="M450 75 L470 75" class="flow" marker-end="url(#ah2)"/>
        <path d="M604 75 L624 75" class="flow" marker-end="url(#ah2)"/>
        <path d="M758 75 L778 75" class="flow" marker-end="url(#ah2)"/>
        <path d="M384 130 L384 185 L845 185 L845 132" class="flow-quiet"/>
        <text x="400" y="208" class="t-sub">no verdict within 7 days: anyone can refund every stake</text>
      </svg></div>
<div class="foot mono"><span>Don't argue. <b>Settle.</b></span><span>mimirmarkets.xyz</span></div>
</div><script>document.fonts.ready.then(()=>{document.body.dataset.ready='1'})</script></body></html>
