# Host-side integration tests for the Mimir program, run against the built
# mimir.so in LiteSVM (no validator needed: solana-test-validator cannot run
# on Windows without symlink privileges). Standalone workspace so its solana-*
# versions never mix with the program's.
#
#   anchor build (see docs/SOLANA.md), then:
#   CARGO_TARGET_DIR=C:\mimir-target-tests cargo test --manifest-path onchain/tests/litesvm/Cargo.toml
#   (MIMIR_SO overrides the .so path; default ../../target/deploy/mimir.so)
[package]
name = "mimir-litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
litesvm = "0.16.0"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
spl-token-interface = "3.0.0"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
